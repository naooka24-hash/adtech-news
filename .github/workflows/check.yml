name: Check Models

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: List models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python check_models.py

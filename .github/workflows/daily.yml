name: Daily AdTech News

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Run script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
          FORM_BASE_URL: ${{ secrets.FORM_BASE_URL }}
          FORM_ENTRY_NAME: ${{ secrets.FORM_ENTRY_NAME }}
          FORM_ENTRY_TITLE: ${{ secrets.FORM_ENTRY_TITLE }}
          FORM_ENTRY_RATING: ${{ secrets.FORM_ENTRY_RATING }}
        run: python main.py

      - name: Commit history
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f sent_history.json ]; then
            echo "履歴ファイルが存在しないためスキップします"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: update sent history [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin main

      - name: Run script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
          FORM_BASE_URL: ${{ secrets.FORM_BASE_URL }}
          FORM_ENTRY_TITLE: ${{ secrets.FORM_ENTRY_TITLE }}
          FORM_ENTRY_RATING: ${{ secrets.FORM_ENTRY_RATING }}
        run: python main.py
